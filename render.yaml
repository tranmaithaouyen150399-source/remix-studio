services:
  - type: web
    name: remix-studio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
